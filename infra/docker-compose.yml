name: scorelineiq

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scorelineiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: scorelineiq
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scorelineiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  prediction-api:
    build:
      context: ../apps/prediction-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://scorelineiq:${POSTGRES_PASSWORD:-changeme}@postgres:5432/scorelineiq
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://scorelineiq:${POSTGRES_PASSWORD:-changeme}@postgres:5432/scorelineiq
      PREDICTION_API_URL: http://prediction-api:8000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
      ADSENSE_CLIENT_ID: ${ADSENSE_CLIENT_ID:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RAPIDAPI_FOOTBALL_STATS_KEY: ${RAPIDAPI_FOOTBALL_STATS_KEY:-}
      # Fixed to the runner image's own layout (WORKDIR /repo, see
      # apps/web/Dockerfile) — not templated from infra/.env since it
      # isn't a secret or something that varies per deployment.
      UPLOADS_DIR: /repo/apps/web/public/uploads
    volumes:
      - uploads_data:/repo/apps/web/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      prediction-api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  uploads_data:
