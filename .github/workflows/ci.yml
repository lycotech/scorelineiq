name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci is intentionally not used: package-lock.json is committed
      # from Windows dev machines and doesn't carry resolvable entries
      # for Linux's platform-specific optional native binaries
      # (lightningcss, etc.) — confirmed the same way apps/web/Dockerfile
      # documents it. npm install resolves fresh for this runner.
      - run: npm install
      - run: npx prisma generate --schema packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
      - run: npm run lint --workspace=web
      - run: npm run build --workspace=web

  prediction-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/prediction-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
