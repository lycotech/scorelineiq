name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # package-lock.json is committed from Windows dev machines and
      # pins lightningcss's optional native binary to the win32 build.
      # `npm install` does NOT backfill a missing platform's resolution
      # into an already-resolved lockfile entry — confirmed empirically,
      # same reason apps/web/Dockerfile doesn't copy the lockfile into
      # its build stage. Removing it here forces a fresh resolve for
      # this runner's platform (Linux glibc).
      - run: rm -f package-lock.json
      - run: npm install
      - run: npx prisma generate --schema packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
      - run: npm run lint --workspace=web
      - run: npm run build --workspace=web

  prediction-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/prediction-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
